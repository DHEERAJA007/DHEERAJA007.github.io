<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <!-- Mock screen: To-Do App with CI/CD (task list + GitHub Actions run) -->
  <defs>
    <radialGradient id="glow" cx=".3" cy=".4" r=".55">
      <stop offset="0" stop-color="#E10600" stop-opacity=".22"/><stop offset="1" stop-color="#E10600" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="#0b0b0b"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <!-- app card -->
  <rect x="90" y="110" width="700" height="800" rx="28" fill="#161616" stroke="#2c2c2c" stroke-width="2"/>
  <text x="140" y="200" fill="#f5f5f5" font-family="Arial Black, Arial, sans-serif" font-size="44">My Tasks</text>
  <g font-family="Arial, sans-serif" font-size="20" letter-spacing="2">
    <rect x="140" y="240" width="90" height="40" rx="20" fill="#E10600"/><text x="160" y="267" fill="#fff">ALL</text>
    <rect x="245" y="240" width="120" height="40" rx="20" fill="#222"/><text x="262" y="267" fill="#aaa">ACTIVE</text>
    <rect x="380" y="240" width="160" height="40" rx="20" fill="#222"/><text x="397" y="267" fill="#aaa">COMPLETED</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="26">
    <rect x="140" y="320" width="600" height="90" rx="16" fill="#1d1d1d"/>
    <circle cx="190" cy="365" r="18" fill="#E10600"/><path d="M181 365 l7 7 13 -14" stroke="#fff" stroke-width="4" fill="none"/>
    <text x="230" y="374" fill="#777" text-decoration="line-through">Write unit tests with Pytest</text>
    <rect x="140" y="430" width="600" height="90" rx="16" fill="#1d1d1d"/>
    <circle cx="190" cy="475" r="18" fill="#E10600"/><path d="M181 475 l7 7 13 -14" stroke="#fff" stroke-width="4" fill="none"/>
    <text x="230" y="484" fill="#777" text-decoration="line-through">Containerise with Docker</text>
    <rect x="140" y="540" width="600" height="90" rx="16" fill="#1d1d1d"/>
    <circle cx="190" cy="585" r="18" fill="none" stroke="#555" stroke-width="3"/>
    <text x="230" y="594" fill="#eee">Add GitHub Actions pipeline</text>
    <rect x="140" y="650" width="600" height="90" rx="16" fill="#1d1d1d"/>
    <circle cx="190" cy="695" r="18" fill="none" stroke="#555" stroke-width="3"/>
    <text x="230" y="704" fill="#eee">Deploy &amp; celebrate</text>
  </g>
  <rect x="140" y="780" width="600" height="80" rx="16" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="440" y="830" fill="#666" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">+ New task</text>
  <!-- CI run -->
  <text x="870" y="170" fill="#8a8a8a" font-family="Arial, sans-serif" font-size="20" letter-spacing="3">GITHUB ACTIONS · CI</text>
  <text x="870" y="230" fill="#f5f5f5" font-family="Impact, Arial Black, sans-serif" font-size="56">push → main</text>
  <g font-family="Courier New, monospace" font-size="26">
    <rect x="870" y="280" width="640" height="96" fill="#121212" stroke="#262626" stroke-width="2"/>
    <circle cx="915" cy="328" r="16" fill="#22c55e"/><text x="950" y="337" fill="#ddd">Install dependencies</text><text x="1480" y="337" fill="#666" text-anchor="end">12s</text>
    <rect x="870" y="392" width="640" height="96" fill="#121212" stroke="#262626" stroke-width="2"/>
    <circle cx="915" cy="440" r="16" fill="#22c55e"/><text x="950" y="449" fill="#ddd">pytest — 14 passed</text><text x="1480" y="449" fill="#666" text-anchor="end">8s</text>
    <rect x="870" y="504" width="640" height="96" fill="#121212" stroke="#262626" stroke-width="2"/>
    <circle cx="915" cy="552" r="16" fill="#22c55e"/><text x="950" y="561" fill="#ddd">docker build</text><text x="1480" y="561" fill="#666" text-anchor="end">41s</text>
  </g>
  <rect x="870" y="640" width="640" height="130" fill="#0f2416" stroke="#1f6b3a" stroke-width="2"/>
  <text x="905" y="722" fill="#22c55e" font-family="Impact, Arial Black, sans-serif" font-size="60">✓ ALL CHECKS PASSED</text>
</svg>
